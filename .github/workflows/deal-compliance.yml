jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the deal rules still work
        run: node selftest.js
      - name: Translate the window choice
        id: win
        run: |
          case "${{ inputs.window }}" in
            "Yesterday")               echo "w=yesterday" >> $GITHUB_OUTPUT ;;
            "Today so far")            echo "w=today"     >> $GITHUB_OUTPUT ;;
            "Last 3 days")             echo "w=3"         >> $GITHUB_OUTPUT ;;
            "Last 7 days")             echo "w=7"         >> $GITHUB_OUTPUT ;;
            "Last 14 days")            echo "w=14"        >> $GITHUB_OUTPUT ;;
            "Last 30 days")            echo "w=30"        >> $GITHUB_OUTPUT ;;
            "Any time (ignore window)") echo "w=any"      >> $GITHUB_OUTPUT ;;
            *)                         echo "w=yesterday" >> $GITHUB_OUTPUT ;;
          esac
      - run: node deal-compliance.js
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          AUDIT_WINDOW_INPUT: ${{ steps.win.outputs.w }}
          DEAL_STAGE_INPUT: ${{ inputs.deal_stage }}
          CLOSEDATE_INPUT: ${{ inputs.close_date }}
          REASON_INPUT: ${{ inputs.reason }}
          LIMIT_INPUT: ${{ inputs.limit }}
          CONSULTANTS_INPUT: "${{ inputs.consultant_1 }}|${{ inputs.consultant_2 }}|${{ inputs.consultant_3 }}"
