name: Deal Compliance

on:
  schedule:
    # 05:20 UTC = 10:20 AM PKT — 20 minutes after the contact audit.
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (safe test, writes nothing)?"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      window:
        description: "Time window (pick Any time when scanning by close date, stage or reason)"
        required: true
        type: choice
        default: "Yesterday"
        options:
          - "Yesterday"
          - "Today so far"
          - "Last 3 days"
          - "Last 7 days"
          - "Last 14 days"
          - "Last 30 days"
          - "Any time (ignore window)"
      deal_stage:
        description: "Deal stage"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "Qualified Client"
          - "CCL Sent"
          - "Last Month Rollover"
          - "Expected Sales"
          - "Payment Made/Deal Won"
          - "Postponed"
          - "Deal Lost"
      close_date:
        description: "Close date"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "Overdue (in the past)"
          - "Today"
          - "This week"
          - "This month"
          - "Next month"
          - "Not set"
      reason:
        description: "Won / Postponed / Lost reason"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "Not set"
          - "Opportunity"
          - "Sale"
          - "Not Responding"
          - "Cannot Afford At This Time"
          - "Started With A Competitor"
          - "No Longer Interested"
          - "Family Issues"
          - "Will Do IELTS First"
          - "I Couldn't Convince"
          - "Job Loss"
          - "Delayed Decision But Will Start"
          - "Self Processing"
          - "Cross Sell"
          - "Low Salary"
      limit:
        description: "How many deals to audit"
        required: true
        type: choice
        default: "all"
